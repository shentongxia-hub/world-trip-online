const NOTES=[5000,2000,1000,500,200,100,50,10];

function initPaper(){S.notices??=[];for(const p of S.players){if(!p.wallet){p.wallet=makeNotes(p.cash);continue}const total=NOTES.reduce((s,d)=>s+d*(p.wallet[d]||0),0);if(total!==p.cash)p.wallet=makeNotes(p.cash);delete p.wallet[1]}}

function addNotice(from,to,amount,reason){if(!amount||amount<0)return;S.notices??=[];S.notices.push({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),from,to,amount,paid:0,reason});log('通知：'+party(from)+'应向'+party(to)+'交付 '+money(amount)+'（'+reason+'）。')}

function nearest(dest){let candidates=alive(),min=Math.min(...candidates.map(p=>Math.min((p.pos-dest+40)%40,(dest-p.pos+40)%40)));return candidates.filter(p=>Math.min((p.pos-dest+40)%40,(dest-p.pos+40)%40)===min)}
