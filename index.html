<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世界之旅 · 联机房间</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",sans-serif;color:#263244;background:#e8e9ec}button,input,select{font:inherit;padding:9px 13px;border:1px solid #d2d7df;border-radius:8px}button{cursor:pointer;background:white}button:disabled{opacity:.4;cursor:default}#lobby{max-width:480px;margin:12vh auto;padding:32px;background:white;border-radius:18px}h1{font-size:26px}#lobby input{width:100%;margin:16px 0}#top{padding:10px 18px;background:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #d2d7df}#top strong{margin-right:auto}#members{display:flex;gap:8px;flex-wrap:wrap}#stage{position:relative;height:calc(100vh - 110px);min-height:600px}iframe{width:100%;height:100%;border:0}#shield{position:absolute;inset:0;background:transparent;z-index:20;display:none}#shield .state{position:sticky;top:12px;margin:12px auto;width:max-content;max-width:90%;padding:8px 16px;border-radius:8px;background:#263244;color:white;box-shadow:0 3px 12px #0002}#error{color:#a93b3b;padding:6px 18px;min-height:28px}#top[hidden],#stage[hidden]{display:none}.mine{background:#dae7fb}.requested{border-color:#bd4742}#waiting{max-width:760px;margin:36px auto;padding:28px;background:#fff;border-radius:18px}#waiting[hidden]{display:none}#roster{display:grid;gap:12px;margin:24px 0}.room-player{display:flex;align-items:center;gap:14px;padding:16px;border-radius:12px;color:white;font-weight:700}.room-player .initial{border:2px solid #fff9;border-radius:50%;width:38px;height:38px;display:grid;place-items:center}.room-player .ready-state{margin-left:auto}.profile{display:flex;gap:14px;flex-wrap:wrap;align-items:center}#colors{display:flex;gap:8px}#colors button{width:38px;height:38px;border:3px solid transparent;padding:0;border-radius:50%}#colors button.selected{outline:2px solid #263244;outline-offset:3px}#colors button:disabled{opacity:.2}#top label{display:none}</style><div id="lobby"><h1>世界之旅</h1><p id="welcome">创建房间，把链接发给朋友。</p><input id="name" placeholder="你的名字" maxlength="30"><button id="enter">创建房间</button></div><div id="top" hidden><strong id="status"></strong><button id="copy">复制房间链接</button><label>我的玩家 <select id="seat"></select></label><button id="request">请求操作</button><div id="members"></div></div><section id="waiting" hidden><h1>等待大家准备</h1><div id="roster"></div><div class="profile"><input id="playerName" maxlength="16" placeholder="你的名字"><div id="colors"></div><button id="ready">准备</button><button id="start">开始游戏</button></div></section><div id="error" role="status"></div><div id="stage" hidden><iframe id="game" title="世界之旅棋盘"></iframe><div id="shield"><div class="state" id="watching"></div></div></div><script src="/client.js"></script></html>
